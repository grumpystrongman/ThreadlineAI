name: Jarvis Bridge Validation

on:
  push:
    branches:
      - feature/jarvis-runtime-bridge
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2

      - name: Restore .NET service, device MCP, and tests
        run: |
          dotnet restore src/Threadline.Core/Threadline.Core.csproj
          dotnet restore src/Threadline.Infrastructure/Threadline.Infrastructure.csproj
          dotnet restore src/Threadline.Service/Threadline.Service.csproj
          dotnet restore src/Threadline.DeviceMcp/Threadline.DeviceMcp.csproj
          dotnet restore tests/Threadline.Core.Tests/Threadline.Core.Tests.csproj
          dotnet restore tests/Threadline.Service.Tests/Threadline.Service.Tests.csproj

      - name: Build service
        run: dotnet build src/Threadline.Service/Threadline.Service.csproj --configuration Release --no-restore

      - name: Build Windows Device MCP
        run: dotnet build src/Threadline.DeviceMcp/Threadline.DeviceMcp.csproj --configuration Release --no-restore

      - name: Smoke test Windows Device MCP protocol
        shell: pwsh
        run: |
          $dll = Resolve-Path 'src/Threadline.DeviceMcp/bin/Release/net8.0-windows10.0.19041.0/Threadline.DeviceMcp.dll'
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"threadline-ci","version":"1.0"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          $output = @($requests | & dotnet $dll)
          if ($LASTEXITCODE -ne 0) { throw "Device MCP exited with code $LASTEXITCODE" }
          if ($output.Count -lt 2) { throw "Expected initialize and tools/list responses; got $($output.Count)." }

          $initialize = $output[0] | ConvertFrom-Json
          if ($initialize.id -ne 1 -or -not $initialize.result.serverInfo.name) {
            throw 'Device MCP initialize response was invalid.'
          }

          $toolResponse = $output[-1] | ConvertFrom-Json
          $names = @($toolResponse.result.tools | ForEach-Object { $_.name })
          $required = @(
            'observe_desktop','inspect_controls','capture_window',
            'open_application','focus_window','invoke_control','set_control_text',
            'read_file','write_file','run_powershell','send_keys','click_at'
          )
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "Device MCP tool '$name' was not advertised." }
          }
          Write-Host "Device MCP advertised $($names.Count) tools: $($names -join ', ')"

      - name: Restore and build Windows app with Visual Studio MSBuild
        shell: pwsh
        run: |
          msbuild src/Threadline.Windows/Threadline.Windows.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Run core tests
        run: dotnet test tests/Threadline.Core.Tests/Threadline.Core.Tests.csproj --configuration Release --no-restore --logger trx

      - name: Run service tests
        run: dotnet test tests/Threadline.Service.Tests/Threadline.Service.Tests.csproj --configuration Release --no-restore --logger trx
